name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  sitio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Detectar sitio
        id: sitio
        working-directory: .
        run: echo "existe=$([ -f site/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.sitio.outputs.existe == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.sitio.outputs.existe == 'true'
        run: npm ci
      - if: steps.sitio.outputs.existe == 'true'
        run: npm run build
