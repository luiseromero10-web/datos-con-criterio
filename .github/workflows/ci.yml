name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  apps:
    # Una app por proyecto de Vercel: cada una se revisa y se compila por separado.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, seguridad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Un solo npm ci en la raíz: instala todos los espacios de trabajo, incluido el paquete común @dcc/marca.
      - run: npm ci
      - run: npm run lint -w apps/${{ matrix.app }}
      # El build genera los tipos de Next que necesita el comprobador, por eso va antes.
      - run: npm run build -w apps/${{ matrix.app }}
      - run: npm run tipos -w apps/${{ matrix.app }}
  paquetes:
    # Paquetes compartidos: aquí se prueba, entre otras cosas, que la analítica respeta «no rastrear» y el interruptor de apagado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run tipos -w packages/comunidad
      - run: npm run test -w packages/comunidad
      # Migración contra un Postgres local (PGlite) y la lógica de la función dcc-comunidad. No toca ningún proyecto real.
      - run: npm run test -w supabase
