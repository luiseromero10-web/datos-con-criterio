[project]
name = "datos-con-criterio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.127",
    "duckdb>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pandera>=0.35.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "ruff>=0.17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "site"]
